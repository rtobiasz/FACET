# Image-conditioned stylization (paper Sec. 4.4; the appendix's stylization figure): the four-image
# image-style set of OmniStyle-INR (content coco_5/8/11/17, styles fire / starry_night / mosaic / scream).
# The content image is first fitted with the settings below, then its appearance is
# optimized with CLIP directional + patch terms, a Gram term and a content term; geometry stays fixed.
[train]
active_conditioning_dimensions = 0

[stylize]
steps = 3000
save_every = 500
num_crops = 64
crop_size = 128
seed = 120
with_base_rgb = true
model_lr = 0.005
model_reg_weight = 0.0001
lambda_content = 1.5
lambda_gram = 600
save_styled_checkpoint = true

[expected]
clip_style_similarity_l14 = 71.7
